<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 
        
        <div>...</div>
        <a href="...">...</a>
        <p>...</p>
        <br>
        <hr>
        <table>...</table>
        <img src"...">
        <form action="..." method="get / post">
            <input name="..." type="text">
            <button>...</button>
        </form>
        <input>
          
    -->
    <h1>Esercizio javascript</h1>
    <hr>

    <br>

    <button onclick="loadData()">Carica dati</button>
    <button onclick="test()">test</button>
    <br>
    <a href="users.html">Vai alla pagina utenti</a>
    <br>

    <script>
        /*
            esegue chiamata http per scaricare dati
        */
       var n = 0
        function loadData() {
            fetch('https://jsonplaceholder.typicode.com/posts')
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    const container = document.createElement('div');
                    
                    data.forEach(post => {
                        const postElement = document.createElement('div');
                        postElement.innerHTML = `<h2>${post.title}</h2><p>${post.body}</p>`;
                        container.appendChild(postElement);
                        n++
                    });
                    document.body.appendChild(container);
                    console.log(`Number of posts loaded: ${n}`);
                    const tag = document.createElement('h3');
                    tag.innerHTML = `Number of posts loaded: ${n}`;
                    document.body.appendChild(tag);
                })
                .catch(error => console.error('Error fetching data:', error));
            }

        function test() {
            console.log(n);
        }
    </script>
</body>
</html>
