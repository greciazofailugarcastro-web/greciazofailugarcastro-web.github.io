/* VOICE: a working business tool, calm and exact, like the shipped CRM in the proposal
   IDEA: the NB Computers back office: one card per customer, every order traceable
   PICTURE: the live app itself, opening on the dashboard mid-day

   LAYOUT: sidebar + work area; stacks under 860px */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f8,#0f141b);--card:light-dark(#fff,#18202b);--ink:light-dark(#152132,#e6ebf2);--mut:light-dark(#5d6b7e,#9aa7b8);
--line:light-dark(#e1e6ee,#2a3442);--soft:light-dark(#f7f9fc,#1d2733);--nav:#16304f;--nav2:#21406a;--pri:#1e3a5f;--acc:#3b82c4;
--amb:light-dark(#fff6e3,#3a2d12);--ambk:light-dark(#8a5a0b,#f3c46b);--grn:light-dark(#e5f6ec,#11301f);--grnk:light-dark(#17703d,#7ddc9f);
--red:light-dark(#fdecec,#3a1717);--redk:light-dark(#a32020,#ff9b9b);--blu:light-dark(#e8f0fb,#14263d);--bluk:light-dark(#1d4f91,#93c0f5);
--vio:light-dark(#f1ecfd,#261d3d);--viok:light-dark(#5b35b5,#c3adff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1{font:700 22px/1.2 'Space Grotesk',Inter,sans-serif;margin:0}
h2{font:600 15px/1.3 Inter,sans-serif;margin:0 0 10px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:#cbd8e8;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:0 18px 16px;color:#fff;font-weight:700}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-style:normal;font-size:13px}
.side .sec{font-size:11px;color:#86a0c0;padding:14px 18px 6px}
.side button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 18px;border:0;background:none;color:#cbd8e8;text-align:left;cursor:pointer;font-size:13.5px}
.side button:hover{background:#1c3a60}
.side button.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 #7fb5ee}
.side .cnt{margin-left:auto;background:#f0b44a;color:#3a2600;border-radius:10px;font-size:11px;font-weight:700;padding:0 7px}
.top{display:flex;gap:10px;align-items:center;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.search{flex:1;white-space:nowrap;overflow:hidden;max-width:520px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--soft);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut);cursor:pointer}
.search kbd{margin-left:auto;font:12px Inter;border:1px solid var(--line);border-radius:5px;padding:0 6px}
.sp{flex:1}
.main{padding:20px 22px 60px;max-width:1320px}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn:focus-visible,.side button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.ok{background:#178a46;border-color:#178a46;color:#fff}
.btn.warn{background:var(--amb);color:var(--ambk);border-color:#e9c26f}.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.who{display:flex;align-items:center;gap:8px}
.who select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px}
.bell{position:relative}.bell b{position:absolute;top:-6px;right:-6px;background:#d33;color:#fff;border-radius:10px;font-size:10px;padding:0 5px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.crumb{font-size:12px;color:var(--mut);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.p0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.side2{grid-template-columns:minmax(0,1fr) 360px}
.kpi{font:700 28px/1.1 'Space Grotesk',sans-serif}.lab{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-align:left;color:var(--mut);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap}
.t-amb{background:var(--amb);color:var(--ambk)}.t-grn{background:var(--grn);color:var(--grnk)}.t-red{background:var(--red);color:var(--redk)}.t-blu{background:var(--blu);color:var(--bluk)}.t-vio{background:var(--vio);color:var(--viok)}.t-gry{background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:12px;color:var(--mut);font-weight:600}
.in{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:14px;width:100%}
textarea.in{height:72px;padding:8px 10px}
.mut{color:var(--mut)}.small{font-size:12px}
.alert{border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.a-amb{background:var(--amb);color:var(--ambk);border:1px solid #e9c26f}.a-red{background:var(--red);color:var(--redk);border:1px solid #eaa}.a-blu{background:var(--blu);color:var(--bluk);border:1px solid #a9c8ef}.a-grn{background:var(--grn);color:var(--grnk);border:1px solid #9bd8b2}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;padding-bottom:10px}.tl div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl small{display:block;color:var(--mut);font-size:11.5px}
.kan{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:300px}
.col.drop{outline:2px dashed var(--acc)}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--mut);cursor:pointer}.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--pri)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.5);display:grid;place-items:start center;padding:6vh 16px;z-index:50;overflow:auto}
.md{background:var(--card);border-radius:14px;width:min(720px,100%);box-shadow:0 30px 70px rgba(0,0,0,.35)}
.md.wide{width:min(1060px,100%)}
.mdh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.mdb{padding:16px 18px}.mdf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--mut)}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
#toast div{background:#152132;color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:380px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}
.pal input{border:0;border-bottom:1px solid var(--line);width:100%;font-size:18px;padding:16px 18px;background:none;outline:none}

.portal{background:var(--card);border-radius:14px;overflow:hidden}
.pbar{background:var(--soft);padding:8px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.ok-i{color:var(--grnk);font-weight:700}.ko-i{color:var(--redk);font-weight:700}
.empty{padding:26px;text-align:center;color:var(--mut)}

.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0;vertical-align:middle;margin-right:6px}
.fade{animation:fin .28s ease}@keyframes fin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.hero{background:linear-gradient(120deg,#16304f 0%,#1e4a7a 60%,#2e809d 100%);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero h1{color:#fff;font-size:26px}.hero p{margin:4px 0 0;color:#cfe0f3}
.hero .btn{background:#fff;color:#16304f;border-color:#fff}

.hbar .bar{height:12px}.hbar .bar b{border-radius:5px}
.stp{display:flex;gap:0;margin:4px 0 14px;overflow-x:auto}
.stp div{flex:1;min-width:110px;text-align:center;font-size:11.5px;color:var(--mut);position:relative;padding-top:26px}
.stp div::before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line)}
.stp div::after{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:10px;line-height:16px;font-weight:700}
.stp div.done{color:var(--ink)}.stp div.done::before{background:#2e9d5b}.stp div.done::after{background:#2e9d5b;border-color:#2e9d5b;color:#fff;content:"✓"}
.stp div.cur{color:var(--ink);font-weight:700}.stp div.cur::before{background:linear-gradient(90deg,#2e9d5b 50%,var(--line) 50%)}.stp div.cur::after{border-color:var(--acc);background:var(--acc);color:#fff}
#tour{position:fixed;left:250px;bottom:20px;z-index:80;width:min(430px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);padding:16px 18px;display:none}

#tour h3{margin:4px 0 6px;font:700 17px/1.25 'Space Grotesk',Inter,sans-serif}

.bnav{display:none}
.icn{width:36px;padding:0;justify-content:center}
#cap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(13,26,44,.92);color:#fff;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:600;max-width:900px;text-align:center;z-index:70;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#cap small{display:block;font-weight:500;font-size:13px;color:#b9cbe2}

#tour{left:12px;right:12px;bottom:76px;width:auto}.kan{grid-template-columns:repeat(6,78vw)}.stp div{min-width:64px;font-size:10px}.hero{padding:18px}.hero h1{font-size:21px}}
@media(max-width:600px){.g2,.g3,.side2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.kpi{font-size:22px}.hero .btn{flex:1;justify-content:center}.main{padding:14px}.stack thead{display:none}.stack tr{display:grid;padding:8px 0}.stack td{border:0;padding:2px 12px}}
@media print{.side,.top,#toast{display:none}}
</style>

 return{code,q,ris,tr,ord,manca:Math.max(0,q-ris-tr-ord)}})}

const OSTEP=['Confermato','In approvvigionamento','In assemblaggio','Pronto','Spedito','Consegnato'];
function ordine(o){
 const f=fabbisogno(o),p=S.preventivi.find(x=>x.id===o.pv),man=f.some(x=>x.manca)&&o.as?.stato!=='Completato',can2=['admin','log'].includes(R());
 const canoni=p.righe.filter(r=>recurring(r.code));
 return `<div class="crumb">Ordini clienti › ${o.id}</div><div class="hrow"><button class="btn sm" data-a="go" data-v="ordini">←</button><h1>Ordine del cliente ${o.id}</h1>${tag(o.stato,stTag(o.stato))}${tag(CL(o.cli).nome,'vio')}<div class="sp"></div>
 ${can2&&man?`<button class="btn pri" data-a="proponi" id="btn-proponi">Trova i pezzi mancanti</button>`:''}${o.stato==='Pronto'&&can2?`<button class="btn pri" data-a="spedisci" id="btn-spedisci">Spedisci al cliente</button>`:''}${o.stato==='Spedito'&&can2?`<button class="btn ok" data-a="consegna" id="btn-consegna">✓ Segna consegnato</button>`:''}</div>
 <div class="card" style="margin-bottom:12px;padding-bottom:4px"><div class="small mut" style="margin-bottom:4px">L'ordine è del cliente <b style="color:var(--ink)">${esc(CL(o.cli).nome)}</b> · nato dal preventivo ${o.pv} accettato da ${esc(p.acc?.nome||'')}</div><div class="stp">${OSTEP.map((x,k)=>{const i=OSTEP.indexOf(o.stato);return `<div data-n="${k+1}" class="${k<i||o.stato==='Consegnato'?'done':k===i?'cur':''}">${x}</div>`}).join('')}</div></div>
 <div class="card p0" style="margin-bottom:12px"><div style="padding:12px 14px 0"><h2>Fabbisogno di pezzi · sede di lavoro: Centrale</h2></div><table><thead><tr><th>Articolo</th><th class="n">Serve</th><th class="n">Riservati</th><th class="n">In transito</th><th class="n">Ordinati</th><th class="n">Da coprire</th></tr></thead><tbody>
 ${f.map(x=>`<tr><td><b>${esc(IT(x.code).n)}</b><div class="small mut">${x.code}</div></td><td class="n">${x.q}</td><td class="n">${x.ris}</td><td class="n">${x.tr||'—'}</td><td class="n">${x.ord||'—'}</td><td class="n ${x.manca?'ko-i':'ok-i'}">${x.manca||'✓'}</td></tr>`).join('')}</tbody></table></div>
 <div class="grid side2"><div class="card"><h2>Collegati</h2><table><tbody>
 <tr><td>Preventivo accettato</td><td><button class="btn sm" data-a="go" data-v="preventivi" data-s="${o.pv}">${o.pv}</button></td></tr>
 ${S.trasf.filter(t=>t.comm===o.id).map(t=>`<tr><td>Trasferimento ${t.id} · ${t.da} → ${t.a}</td><td>${tag(t.stato,stTag(t.stato))} <span class="small mut">${t.ddt}</span></td></tr>`).join('')}
 ${S.po.filter(x=>x.comm===o.id).map(x=>`<tr><td>Ordine al fornitore ${x.id} · ${x.forn}</td><td>${tag(x.stato,stTag(x.stato))}</td></tr>`).join('')}
 <tr><td>Assemblaggio</td><td>${tag(o.as?.stato||'—',o.as?.stato==='Completato'?'grn':'amb')}</td></tr>${o.track?`<tr><td>Spedizione al cliente</td><td>${tag('Spedito','grn')} <span class="small mut">${o.track}</span></td></tr>`:''}</tbody></table></div>
 <div class="card"><h2>Canoni e noleggi da attivare</h2>${canoni.length?canoni.map(r=>`<div class="chk"><span class="tag t-vio">${r.qty} ×</span>${esc(IT(r.code).n)}</div>`).join(''):'<div class="mut small">Nessuno</div>'}<div class="small mut" style="margin-top:6px">Passano al commercialista con il periodo di competenza.</div></div></div>`;
}

 notify(p.resp,`${c.nome} ha accettato ${p.id}: creato ${oid}`,['ordini',oid]);notify('sc',`Nuovo ordine del cliente ${oid}: trova i pezzi`,['ordini',oid]);notify('lm',`Nuovo assemblaggio per ${oid}`,['assemblaggio']);notify('ac',`3 documenti di ${c.nome} da inviare al commercialista`,['commercialista']);
 closeM();toast(`Accettato! Creato l'ordine del cliente ${oid}`);render()};

/* fabbisogno: proposta automatica */
function piano(o){const out=[];fabbisogno(o).forEach(x=>{let m=x.manca;if(!m)return;
 const fc=Math.min(m,libero(x.code,'Centrale'));if(fc>0){out.push({k:'ris',code:x.code,qty:fc});m-=fc}
 SEDI.slice(1).forEach(s=>{if(m<=0)return;const l=libero(x.code,s),q=Math.min(m,l);if(q>0){out.push({k:'tr',code:x.code,qty:q,da:s});m-=q}});
 if(m>0){const f=[...S.fornitori].sort((a,b)=>a.gg-b.gg)[0];out.push({k:'po',code:x.code,qty:m,forn:f.n,gg:f.gg})}});return out}
A.proponi=()=>{const o=S.ordini.find(x=>x.id===S.sel),pl=piano(o);
 modal('Proposta per coprire i pezzi',`<table><thead><tr><th>Azione</th><th>Articolo</th><th class="n">Q.tà</th><th>Dettaglio</th></tr></thead><tbody>${pl.map(a=>`<tr><td>${a.k==='ris'?tag('Riserva','grn'):a.k==='tr'?tag('Trasferisci','amb'):tag('Ordina','blu')}</td><td>${esc(IT(a.code).n)}</td><td class="n">${a.qty}</td><td class="small">${a.k==='ris'?'Pezzi liberi al Centrale':a.k==='tr'?`Da ${a.da} al Centrale, con bolla`:`${a.forn}, arrivo in ${a.gg} giorni`}</td></tr>`).join('')}</tbody></table><div class="small mut" style="margin-top:8px">Prima i pezzi liberi della sede di lavoro, poi gli altri negozi, infine il fornitore più rapido. Si può modificare a mano.</div>`,
 `<button class="btn" data-a="close">Annulla</button><button class="btn pri" data-a="applica" id="btn-applica">Applica la proposta</button>`,true)};
A.applica=()=>{const o=S.ordini.find(x=>x.id===S.sel),pl=piano(o);const trBy={},poBy={};
 pl.forEach(a=>{if(a.k==='ris')S.riserve.push({id:'RS-'+Math.random().toString(36).slice(2,6),ord:o.id,code:a.code,sede:'Centrale',qty:a.qty,tec:'lm'});
  if(a.k==='tr'){(trBy[a.da]=trBy[a.da]||[]).push(a)}if(a.k==='po'){(poBy[a.forn]=poBy[a.forn]||[]).push(a)}});
 Object.entries(trBy).forEach(([da,L])=>{L.forEach(a=>S.riserve.push({id:'RS-'+Math.random().toString(36).slice(2,6),ord:o.id,code:a.code,sede:da,qty:a.qty,tec:'lm',viaggio:true}));
  creaTrasf(da,'Centrale',L.map(a=>({code:a.code,qty:a.qty})),o.id,true)});
 Object.entries(poBy).forEach(([f,L])=>{const fo=S.fornitori.find(x=>x.n===f);const id='PO-0'+(++S.seq.PO);S.po.push({id,forn:f,comm:o.id,righe:L.map(a=>({code:a.code,qty:a.qty,ric:0})),stato:'Ordinato',arrivo:new Date(clock.getTime()+fo.gg*864e5)})});
 log(`Riserve, trasferimenti e ordini ai fornitori per ${o.id}`);closeM();toast('Pezzi riservati, trasferimenti e ordini creati');render()};

/* trasferimenti */
function creaTrasf(da,a,righe,comm,giaRis){const id='TR-2026-'+pad(++S.seq.TR,3),ddt='DT-2026-'+pad(++S.seq.DT,4);const res=[];let bloccati=[];
 righe.forEach(r=>{let sped;if(giaRis){sped=r.qty;S.riserve=S.riserve.filter(x=>!(x.viaggio&&x.ord===comm&&x.code===r.code&&x.sede===da))}else{sped=Math.min(r.qty,Math.max(0,libero(r.code,da)))}
  const bloc=r.qty-sped;if(bloc>0&&riservato(r.code,da)>0)bloccati.push({code:r.code,qty:bloc,sede:da});
  S.stock[r.code][da]-=sped;res.push({code:r.code,qty:r.qty,sped,bloc:bloc>0?bloc:0})});
 const t={id,da,a,righe:res,comm,ddt,corr:'Corriere convenzionato',track:String(80000000000+Math.floor(Math.random()*9e9)).slice(0,12),stato:'Bolla creata',q:now()};S.trasf.unshift(t);
 bloccati.forEach(b=>{const rs=S.riserve.find(x=>x.code===b.code&&x.sede===b.sede);const msg=`${ME().n} ha chiesto ${b.qty} × ${IT(b.code).n} da ${b.sede}: il pezzo è riservato per ${rs.ord} e non è partito.`;
  S.avvisi.unshift({id:'BL'+Math.random().toString(36).slice(2,6),to:rs.tec,t:msg,blocco:true,ris:rs.id,q:now(),letto:false});log('Blocco momentaneo: '+msg)});
 return {t,bloccati}}
A.nuovoTr=()=>{const codes=Object.values(S.catalog).filter(i=>['componente','finito'].includes(i.t));
 modal('Nuovo trasferimento tra sedi',`<div class="grid g3"><div class="f"><label>Da</label><select class="in" id="tr-da">${SEDI.map(s=>`<option ${s==='Sede 2'?'selected':''}>${s}</option>`).join('')}</select></div><div class="f"><label>A</label><select class="in" id="tr-a">${SEDI.map(s=>`<option ${s==='Sede 3'?'selected':''}>${s}</option>`).join('')}</select></div><div class="f"><label>Quantità</label><input class="in" type="number" id="tr-q" value="1" min="1"></div></div>
 <div class="f" style="margin-top:10px"><label>Articolo</label><select class="in" id="tr-c">${codes.map(i=>`<option value="${i.c}" ${i.c==='SSD-NV-1T'?'selected':''}>${esc(i.n)}</option>`).join('')}</select></div>
 <div class="alert a-blu" style="margin-top:10px">I pezzi liberi partono subito, senza autorizzazione, con bolla e corriere. I pezzi riservati ad altri assemblaggi restano bloccati e il tecnico viene avvisato.</div>`,
 `<button class="btn" data-a="close">Annulla</button><button class="btn pri" data-a="creaTr" id="btn-creatr">Genera bolla e trasferisci</button>`)};
A.creaTr=()=>{const da=$('#tr-da').value,a=$('#tr-a').value,q=+$('#tr-q').value,c=$('#tr-c').value;if(da===a)return toast('Scegli due sedi diverse');
 const {t,bloccati}=creaTrasf(da,a,[{code:c,qty:q}],null,false);closeM();
 toast(bloccati.length?`Partiti ${t.righe[0].sped} pezzi con bolla ${t.ddt}. ${bloccati[0].qty} bloccati: avvisato il tecnico.`:`Bolla ${t.ddt} creata, ${t.righe[0].sped} pezzi in partenza`);render()};
A.avanza=d=>{const t=S.trasf.find(x=>x.id===d.t),nx={'Bolla creata':'Ritirato','Ritirato':'In transito','In transito':'Ricevuto'};t.stato=nx[t.stato];
 if(t.stato==='Ricevuto'){t.righe.forEach(r=>{S.stock[r.code][t.a]+=r.sped;if(t.comm)S.riserve.push({id:'RS-'+Math.random().toString(36).slice(2,6),ord:t.comm,code:r.code,sede:t.a,qty:r.sped,tec:'lm'})});toast(`Ricevuto in ${t.a}: seriali controllati con la bolla ${t.ddt}`)}
 checkReady();render()};
A.mantieni=d=>{const b=S.avvisi.find(x=>x.id===d.id);b.chiuso=true;log('Riserva mantenuta: '+b.t);toast('Riserva mantenuta. Decisione salvata nello storico.');render()};

let palSel=0;
A.pal=()=>{modal('Cerca o fai',`<div class="pal"><input id="pal-in" placeholder="Scrivi un cliente, PV, OC, articolo…" autocomplete="off"><div id="pal-r"></div></div><div class="small mut" style="padding:8px 0 0">↑ ↓ per scegliere · Invio per aprire</div>`);$('#pal-in').focus();palRun()};
function palItems(q){q=q.toLowerCase();const out=[];
 S.clienti.forEach(c=>(c.nome+c.tel+c.piva).toLowerCase().includes(q)&&out.push(['Cliente',c.nome,['clienti',c.id]]));
 S.preventivi.forEach(p=>(p.id+CL(p.cli).nome).toLowerCase().includes(q)&&out.push(['Preventivo',p.id+' · '+p.stato,['preventivi',p.id]]));
 S.ordini.filter(o=>o.id!=='OC-399').forEach(o=>(o.id+CL(o.cli).nome).toLowerCase().includes(q)&&out.push(['Ordine del cliente',o.id+' · '+o.stato,['ordini',o.id]]));
 Object.values(S.catalog).forEach(i=>(i.c+i.n).toLowerCase().includes(q)&&out.push(['Articolo',i.n,['catalogo',i.c]]));
 const acts=[['Azione','Nuovo cliente rapido','nuovoCli'],['Azione','Nuovo preventivo da modello','nuovoPv'],['Azione','Nuovo trasferimento tra sedi','nuovoTr'],['Azione','Registra una telefonata','regTel'],['Azione','Nuova richiesta','nuovaRich'],['Azione','Nuova trattativa','nuovaTratt'],['Azione','Nuovo appuntamento','nuovoApp'],['Azione','Nuovo articolo','nuovoArt'],['Azione','Nuovo ordine al fornitore','nuovoPO']];
 return out.filter(x=>can(x[2][0])).slice(0,8).concat(acts.filter(a=>a[1].toLowerCase().includes(q)||!q))}
function palRun(){const L=palItems($('#pal-in').value);palSel=Math.min(palSel,L.length-1);$('#pal-r').innerHTML=L.map((x,k)=>`<div class="it ${k===palSel?'sel':''}" data-a="palGo" data-k="${k}">${tag(x[0],x[0]==='Azione'?'gry':'blu')}<b>${esc(x[1])}</b></div>`).join('')||'<div class="empty">Nessun risultato</div>';window.__pl=L}
A.palGo=d=>{const x=(window.__pl||[])[+d.k];if(!x)return;closeM();if(typeof x[2]==='string')A[x[2]]({});else go(x[2][0],x[2][1])};

/* ---------- eventi ---------- */
document.addEventListener('click',e=>{if(e.target.closest('select,input,textarea')&&!e.target.matches('[data-a]'))return;const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')e.preventDefault();const f=A[el.dataset.a];if(f){if(el.dataset.a!=='ovclose')e.stopPropagation();f(el.dataset,el,e)}});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.ch;if(!k)return;
 if(k==='fase'){const t=S.trattative.find(x=>x.id===el.dataset.t);t.fase=el.value;t.ferma=false;toast(`${CL(t.cli).nome}: fase «${FASI.find(f=>f[0]===t.fase)[1]}»`);render();return}
 if(k==='me'){S.me=el.value;S.view='dash';S.sel=null;render();toast('Ora sei '+ME().n+' · '+ROLES[R()]);return}
 if(k.startsWith('cli.')){const c=CL(S.sel),f=k.slice(4);const old=c[f];c[f]=el.value;if(['listino','resp','sdi','pec','piva'].includes(f))log(`${c.nome}: ${f} da «${old||'—'}» a «${el.value}»`);render();return}
 if(k.startsWith('riga.')){const p=curPv(),r=p.righe[+el.dataset.k];r[k.slice(5)]=Math.max(0,+el.value||0);if(k==='riga.qty'&&r.qty<1)r.qty=1;render();return}
 if(k.startsWith('reg.')){const pth=k.slice(4).split('.');if(pth.length===1)S.regole[pth[0]]=+el.value;else S.regole[pth[0]][pth[1]]=+el.value;log('Regola preventivi modificata: '+k.slice(4)+' = '+el.value);render()}});
document.addEventListener('input',e=>{if(e.target.dataset.dup)dupCheck();if(e.target.id==='pal-in'){palSel=0;palRun()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();A.pal()}
 if(e.key==='Escape')closeM();
 if($('#pal-in')&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter')return A.palGo({k:palSel});palSel=Math.max(0,palSel+(e.key==='ArrowDown'?1:-1));palRun()}

document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(c)e.dataTransfer.setData('text/plain',c.dataset.drag)});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(c){e.preventDefault();c.classList.add('drop')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest('[data-drop]');if(c)c.classList.remove('drop')});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-drop]');if(!c)return;e.preventDefault();const t=S.trattative.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.fase=c.dataset.drop;t.ferma=false;toast(`${CL(t.cli).nome}: fase «${FASI.find(f=>f[0]===t.fase)[1]}»`);render()}});

 ['Ogni parte è dettagliata','Workstation con tutti i componenti, monitor, installazione e, a parte, i canoni mensili di stampante a noleggio e software. Metto uno sconto dell\'8%.',()=>{const p=curPv();p.righe[0].sc=8;p.righe[1].sc=5;render()}],
 ['Lo sconto supera il limite del ruolo','Il commerciale può dare fino al 5%: il preventivo va all\'amministratore con il motivo scritto. Entro i limiti, invece, partirebbe subito.',()=>A.pvInvia()],

 ['Come lo vede il cliente','M. Bianchi lo invia. Il cliente apre una pagina chiara: cosa paga una volta, cosa ogni mese.',()=>{S.me='mb';go('preventivi',S.preventivi[0].id);A.pvMail();A.portale()}],
 ['Il cliente accetta e firma online','Si registrano nome, data e versione. Nasce l\'ordine del cliente, collegato al preventivo.',()=>{A.portale();A.accetta();go('ordini',S.preventivi[0].ord)}],
 ['Il CRM trova i pezzi','S. Conti (logistica) chiede la proposta: prima il Centrale, poi gli altri negozi, poi il fornitore più rapido.',()=>{S.me='sc';go('ordini',S.preventivi[0].ord);A.proponi()}],
 ['Trasferimenti con bolla e tracking','Riserve, trasferimenti tra sedi con DDT e corriere, ordine al fornitore: tutto creato in un passo.',()=>{A.applica();go('magazzini')}],

 ['Spedito e consegnato','La logistica spedisce con tracking e segna la consegna. La pratica del cliente è chiusa.',()=>{S.me='sc';go('ordini',S.preventivi[0].ord);A.spedisci();A.consegna()}],
 ['Dati al commercialista','Il CRM non fattura: A. Conti completa il codice SDI mancante e invia i documenti allo studio.',()=>{S.me='ac';CL('C1').sdi='M5UXCR1';S.docs.forEach(d=>d.stato==='Da inviare'&&A.inviaDoc({d:d.id}));go('commercialista')}],

let tourI=-1;
function tourShow(){const t=$('#tour');if(tourI<0){t.style.display='none';return}const x=TOUR[tourI];t.style.display='block';
 t.innerHTML=`<div class="pg"><b style="width:${(tourI+1)/TOUR.length*100}%"></b></div><div class="tn">Passo ${tourI+1} di ${TOUR.length} · ${esc(ME().n)}</div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="row"><button class="btn sm" data-a="tourEsci">Esci</button><span class="sp"></span>${tourI<TOUR.length-1?'<button class="btn pri" data-a="tourNext" id="tour-next">Avanti →</button>':'<button class="btn ok" data-a="tourEsci">Fine ✓</button>'}</div>`}
A.tour=()=>{closeM();tourI=0;TOUR[0][2]();tourShow()};
A.tourNext=()=>{closeM();tourI++;TOUR[tourI][2]();tourShow()};
A.tourEsci=()=>{tourI=-1;tourShow()};

window.__S=()=>S;
render();
